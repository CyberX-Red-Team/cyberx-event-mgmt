name: Code Quality

on:
  pull_request:
    branches: [ main, staging ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Correctness rules only (backend/ruff.toml). Formatting and mypy are not
      # enforced: the models use untyped Column() declarations, so mypy is all
      # noise until they move to Mapped[] annotations.
      - name: Run ruff (linter)
        run: |
          cd backend
          ruff check . --output-format=github

      # Medium+ severity fails the build. Reviewed findings carry `# nosec`.
      - name: Run bandit (security linter)
        run: |
          cd backend
          bandit -r app/ -ll -f screen

      - name: Write bandit report
        if: always()
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          retention-days: 30

  complexity:
    name: Code Complexity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install radon
        run: pip install radon

      - name: Check cyclomatic complexity
        run: |
          cd backend
          radon cc app/ -a -nb

      - name: Check maintainability index
        run: |
          cd backend
          radon mi app/ -nb

  dependencies:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Fails on any advisory not in backend/.pip-audit-ignore (the reviewed
      # baseline). Remove an entry once its package is upgraded past the fix.
      - name: Scan dependencies for vulnerabilities
        run: |
          cd backend
          IGNORES=$(grep -oE '^[A-Za-z0-9-]+' .pip-audit-ignore | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r requirements.txt $IGNORES

      - name: Write audit report
        if: always()
        run: |
          cd backend
          pip-audit -r requirements.txt --format json --output audit-report.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: backend/audit-report.json
          retention-days: 30

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose
        run: |
          docker compose config
          docker compose up -d postgres redis
          sleep 10
          docker compose ps
          docker compose down -v

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pin Python: without this the job uses the runner default (3.14), for
      # which pinned wheels like pydantic-core don't exist and pip fails.
      # 3.12 matches production (render.yaml PYTHON_VERSION) and test.yml.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Check for required documentation
        run: |
          echo "Checking for required documentation files..."
          required_files=(
            "README.md"
            "INSTALL.md"
            "SETUP.md"
            "EVENT_MANAGEMENT.md"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

      - name: Check documentation links
        run: |
          cd backend
          # Check for broken markdown links (basic check)
          find . -name "*.md" -exec grep -H "http" {} \; || true

      - name: Validate OpenAPI schema
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Create minimal .env file for app import
          cat > .env << EOF
          DATABASE_URL=postgresql+asyncpg://localhost/test
          SECRET_KEY=test-key
          SENDGRID_API_KEY=SG.test
          SENDGRID_FROM_EMAIL=test@test.com
          POWERDNS_API_URL=http://test
          POWERDNS_USERNAME=test
          POWERDNS_PASSWORD=test
          VPN_SERVER_PUBLIC_KEY=test
          VPN_SERVER_ENDPOINT=test:51820
          EOF
          # Validate that FastAPI app can be imported
          python -c "from app.main import app; print('✅ FastAPI app imports successfully')"
