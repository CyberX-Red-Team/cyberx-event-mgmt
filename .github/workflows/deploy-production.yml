name: Deploy to Production

# Production deploys from main branch only
# Triggered by: version tags (v*) or manual workflow dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - resume
          - suspend
      skip_tests:
        description: 'Skip tests (use for resume/suspend only)'
        required: false
        type: boolean
        default: false

env:
  RENDER_SERVICE_NAME: cyberx-production

jobs:
  test:
    name: Run Tests
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/test.yml

  deploy-production:
    name: Deploy to Production
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event.inputs.action == 'deploy' || github.event.inputs.action == '' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://events.cyberxredteam.org

    steps:
      - name: Record the commit that is live before deploying
        run: |
          before=$(curl -fsS --max-time 10 "https://events.cyberxredteam.org/health" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
          echo "LIVE_BEFORE=${before}" >> "$GITHUB_ENV"
          echo "Live before deploy: ${before:-unknown}"

      - name: Trigger Render Deploy via Deploy Hook
        env:
          PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render deployment for production..."
          echo "Note: Database migrations will run automatically (alembic upgrade head)"
          echo "Note: DATABASE_URL is configured in Render dashboard"

          # Trigger web service deployment and capture response
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${PRODUCTION_DEPLOY_HOOK_URL}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response: $BODY"

          # Extract deploy ID from JSON response
          DEPLOY_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && [ -n "$DEPLOY_ID" ]; then
            echo "✅ Deployment triggered (Deploy ID: $DEPLOY_ID)"
          else
            echo "❌ Deployment failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Wait for the new build to go live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://events.cyberxredteam.org/health
        run: |
          # Poll /health until it reports the commit being deployed (replaces a
          # fixed sleep, which passed whether or not the new build was live).
          expected="${EXPECTED_SHA:0:7}"
          echo "⏳ Waiting for ${HEALTH_URL} to report commit ${expected} (was ${LIVE_BEFORE:-unknown}) ..."
          deadline=$(( $(date +%s) + 1200 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)
            commit=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            version=$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)
            if [ -n "$body" ] && [ -z "$commit" ]; then
              # Build doesn't report its commit (older build or RENDER_GIT_COMMIT
              # unset): fall back to the old behaviour rather than fail.
              echo "::warning::/health does not report a commit; falling back to a 2-minute wait + HTTP 200 check"
              sleep 120
              curl -fsS --max-time 10 "$HEALTH_URL" && exit 0
              echo "❌ Health check failed"; exit 1
            fi
            if [ "$commit" = "$expected" ]; then
              echo "✅ Live: version ${version}, commit ${commit}"
              exit 0
            fi
            if [ -n "$commit" ] && [ -n "$LIVE_BEFORE" ] && [ "$commit" != "$LIVE_BEFORE" ]; then
              # Render deploys the branch head; a newer push can supersede this one.
              echo "::warning::A different new build is live (commit ${commit}, expected ${expected}) -- likely a newer push"
              exit 0
            fi
            echo "  live: ${commit:-unreachable} (version ${version:-?}), waiting ..."
            sleep 15
          done
          echo "❌ Commit ${expected} was not live after 20 minutes"
          exit 1

      - name: Run production smoke tests
        run: |
          echo "🔥 Running production smoke tests..."

          BASE_URL="https://events.cyberxredteam.org"

          # Test public API endpoint (countries list)
          echo "Testing public API..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/api/public/countries")
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Public API responding (HTTP $HTTP_CODE)"
          else
            echo "❌ Public API returned unexpected code: $HTTP_CODE"
            exit 1
          fi

          # Test auth endpoint (should return 403 for missing CSRF or 422)
          echo "Testing auth endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BASE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$HTTP_CODE" -eq 403 ] || [ "$HTTP_CODE" -eq 422 ]; then
            echo "✅ Auth endpoint responding correctly (HTTP $HTTP_CODE)"
          else
            echo "❌ Auth endpoint returned unexpected code: $HTTP_CODE"
            exit 1
          fi

          echo "✅ All production smoke tests passed!"

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "URL: https://events.cyberxredteam.org"
          echo "Tag: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Initiating rollback..."
          echo "⚠️ Manual intervention required"
          echo "Check Render dashboard: https://dashboard.render.com"
          echo "Options:"
          echo "  1. Restore from Supabase backup if needed"
          echo "  2. Roll back to previous version in Render dashboard"
          echo "  3. Check logs for deployment errors"

  resume-production:
    name: Resume Production Service
    if: github.event.inputs.action == 'resume'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://events.cyberxredteam.org

    steps:
      - name: Resume Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.PRODUCTION_RENDER_SERVICE_ID }}
        run: |
          echo "▶️ Resuming production service..."

          curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}"

          echo "⏳ Waiting for service to start..."
          sleep 120

      - name: Verify service resumed
        run: |
          echo "🔍 Verifying service is running..."

          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              https://events.cyberxredteam.org/health)

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Service resumed successfully!"
              exit 0
            fi

            echo "⏳ Attempt $i/$MAX_RETRIES, waiting..."
            sleep 15
          done

          echo "❌ Failed to verify service resumed"
          exit 1

  suspend-production:
    name: Suspend Production Service
    if: github.event.inputs.action == 'suspend'
    runs-on: ubuntu-latest
    environment:
      name: production-suspend

    steps:
      - name: Verify safe to suspend
        run: |
          echo "⚠️ About to suspend production service"
          echo "This will stop all traffic to the application"
          echo "Billing will pause until service is resumed"

      - name: Suspend Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.PRODUCTION_RENDER_SERVICE_ID }}
        run: |
          echo "⏸️ Suspending production service..."

          curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}"

          echo "✅ Service suspended!"
          echo "💰 Billing paused"
          echo "📊 Database (Supabase) remains active"

      - name: Verify service suspended
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.PRODUCTION_RENDER_SERVICE_ID }}
        run: |
          echo "🔍 Verifying service is suspended..."

          sleep 30

          SERVICE_INFO=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}")

          SUSPENDED=$(echo "$SERVICE_INFO" | jq -r '.service.suspended')

          if [ "$SUSPENDED" = "suspended" ] || [ "$SUSPENDED" = "true" ]; then
            echo "✅ Service confirmed suspended"
            echo "Resume anytime with: Actions → Deploy to Production → Run workflow → resume"
          else
            echo "⚠️ Service suspension status unclear: $SUSPENDED"
          fi
